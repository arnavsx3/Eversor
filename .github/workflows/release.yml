name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Check release version
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: make check dist-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Publish release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/SHA256SUMS --verify-tag --title "Eversor $GITHUB_REF_NAME" --notes-file docs/release-notes.md
    permissions:
      contents: write
